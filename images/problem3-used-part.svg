<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="p3c-title p3c-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="p3c-title">How much of the memory is used?</title>
  <desc id="p3c-desc">Top: one segment and the hole after it. If the segment is 1 part, the hole is 0.4 part, together 1.4 parts. So the used part is 1 divided by 1.4, about 71.4 percent. Bottom: the whole memory of 1 000 000 bytes. All segments together are 714 286 bytes, 71.4 percent. All holes together are 285 714 bytes, 28.6 percent.</desc>

  <rect x="0.5" y="0.5" width="759" height="239" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#0f172a">How much of the memory is used?</text>

  <g id="p3c-pair">
    <text x="24" y="58" font-size="13" font-weight="700" fill="#334155">One segment and the hole after it</text>
    <rect x="24" y="66" width="300" height="38" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="324" y="66" width="120" height="38" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 3"/>
    <text x="174" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">segment: 1 part</text>
    <text x="384" y="90" text-anchor="middle" font-size="12" fill="#475569">hole: 0.4 part</text>
    <path d="M24 110 V117 H444 V110" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="234" y="135" text-anchor="middle" font-size="12" fill="#475569">together: 1.4 parts</text>
    <text x="470" y="82" font-size="13" fill="#0f172a">used part = 1 ÷ 1.4</text>
    <text x="470" y="101" font-size="13" font-weight="700" fill="#0f172a">≈ 0.714 = 71.4%</text>
  </g>

  <g id="p3c-memory">
    <text x="24" y="166" font-size="13" font-weight="700" fill="#334155">The whole memory: 1 MB = 1 000 000 bytes</text>
    <rect x="24" y="174" width="508.57" height="48" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="532.57" y="174" width="203.43" height="48" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 3"/>
    <text x="278.3" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">all segments together</text>
    <text x="278.3" y="212" text-anchor="middle" font-size="12" fill="#1e3a8a">714 286 bytes = 71.4% of the memory</text>
    <text x="634.3" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">all holes together</text>
    <text x="634.3" y="212" text-anchor="middle" font-size="12" fill="#475569">285 714 bytes = 28.6%</text>
  </g>
</svg>
