    <rect x="314" y="80" width="20" height="30" rx="3"/>
    <rect x="336" y="80" width="20" height="30" rx="3"/>
    <rect x="358" y="80" width="20" height="30" rx="3"/>
    <rect x="380" y="80" width="20" height="30" rx="3"/>
