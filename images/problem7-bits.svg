    <rect x="622" y="80" width="20" height="30" rx="3"/>
    <rect x="644" y="80" width="20" height="30" rx="3"/>
    <rect x="666" y="80" width="20" height="30" rx="3"/>
    <rect x="688" y="80" width="20" height="30" rx="3"/>
    <rect x="710" y="80" width="20" height="30" rx="3"/>
  </g>

  <path d="M28 116 V123 H224 V116" fill="none" stroke="#0d9488" stroke-width="1.5"/>
  <path d="M226 116 V123 H466 V116" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M468 116 V123 H730 V116" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <text x="126" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">page directory: 9 bits</text>
  <text x="126" y="160" text-anchor="middle" font-size="12" fill="#475569">2⁹ = 512 entries</text>
  <text x="346" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">page table: 11 bits</text>
  <text x="346" y="160" text-anchor="middle" font-size="12" fill="#475569">2¹¹ = 2048 entries</text>
  <text x="599" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">offset: 12 bits</text>
  <text x="599" y="160" text-anchor="middle" font-size="12" fill="#475569">2¹² = 4096 bytes = 4 kB in one page</text>
</svg>
