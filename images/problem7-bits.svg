    <rect x="468" y="80" width="20" height="30" rx="3"/>
    <rect x="490" y="80" width="20" height="30" rx="3"/>
    <rect x="512" y="80" width="20" height="30" rx="3"/>
    <rect x="534" y="80" width="20" height="30" rx="3"/>
