    <rect x="182" y="80" width="20" height="30" rx="3"/>
    <rect x="204" y="80" width="20" height="30" rx="3"/>
  </g>
  <g fill="#dbeafe" stroke="#2563eb">
    <rect x="226" y="80" width="20" height="30" rx="3"/>
