<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 184" role="img" aria-labelledby="p7c-title p7c-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="p7c-title">The 32 bits of the address: 9 + 11 + 12</title>
  <desc id="p7c-desc">An address drawn as 32 boxes. The first 9 bits choose one of 512 entries of the page directory. The next 11 bits choose one of 2048 entries of a page table. The last 12 bits are the offset, so a page has 4096 bytes, which is 4 kB. The first 20 bits together are the page number, so there are 1 048 576 pages.</desc>

  <rect x="0.5" y="0.5" width="759" height="183" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#0f172a">The 32 bits of the address: 9 + 11 + 12</text>

  <path d="M28 74 V67 H466 V74" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="247" y="60" text-anchor="middle" font-size="12" fill="#334155">page number: 9 + 11 = 20 bits, so 2²⁰ = 1 048 576 pages</text>
  <path d="M468 74 V67 H730 V74" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="599" y="60" text-anchor="middle" font-size="12" fill="#334155">32 − 9 − 11 = 12 bits</text>

  <g fill="#ccfbf1" stroke="#0d9488">
    <rect x="28" y="80" width="20" height="30" rx="3"/>
    <rect x="50" y="80" width="20" height="30" rx="3"/>
