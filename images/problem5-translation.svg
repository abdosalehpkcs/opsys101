<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" role="img" aria-labelledby="p5c-title p5c-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="p5c-title">From a logical address to a physical address</title>
  <desc id="p5c-desc">The logical address has page number 5 and offset 100. The page table says that page 5 is in frame 18. So the physical address has frame number 18 and offset 100. Only the first part changes. The offset stays the same.</desc>
  <defs>
    <marker id="p5c-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="251" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#0f172a">From a logical address to a physical address</text>

  <g id="p5c-logical">
    <rect x="24" y="52" width="200" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="124" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">page number = 5</text>
    <rect x="224" y="52" width="220" height="46" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="334" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">offset = 100</text>
    <text x="468" y="72" font-size="14" font-weight="700" fill="#0f172a">Logical address</text>
    <text x="468" y="90" font-size="12" fill="#475569">The program uses it.</text>
  </g>

  <g id="p5c-middle">
    <line x1="124" y1="98" x2="124" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#p5c-arrow)"/>
    <rect x="34" y="120" width="180" height="44" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="124" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">page table</text>
    <text x="124" y="155" text-anchor="middle" font-size="12" fill="#334155">page 5 is in frame 18</text>
    <line x1="124" y1="164" x2="124" y2="184" stroke="#64748b" stroke-width="2" marker-end="url(#p5c-arrow)"/>

    <line x1="334" y1="98" x2="334" y2="184" stroke="#64748b" stroke-width="2" marker-end="url(#p5c-arrow)"/>
    <text x="344" y="146" font-size="12" fill="#475569">the same</text>

    <text x="468" y="137" font-size="13" fill="#0f172a">Only the first part changes.</text>
    <text x="468" y="155" font-size="13" fill="#0f172a">The offset stays the same.</text>
  </g>

  <g id="p5c-physical">
    <rect x="24" y="186" width="200" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="124" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">frame number = 18</text>
    <rect x="224" y="186" width="220" height="46" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="334" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">offset = 100</text>
    <text x="468" y="206" font-size="14" font-weight="700" fill="#0f172a">Physical address</text>
    <text x="468" y="224" font-size="12" fill="#475569">The real place in memory.</text>
  </g>
</svg>
