<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-labelledby="p3a-title p3a-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="p3a-title">After some time, memory is full of small holes</title>
  <desc id="p3a-desc">A strip of memory with four segments, programs A, B, C and D. After each segment there is a small free hole. A new program E is larger than each hole, so it does not fit into any hole, although the four holes together are big enough. This is external fragmentation.</desc>

  <rect x="0.5" y="0.5" width="759" height="189" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#0f172a">After some time, memory is full of small holes</text>

  <g fill="#dbeafe" stroke="#2563eb">
    <rect x="24" y="56" width="120" height="50" rx="4"/>
    <rect x="192" y="56" width="120" height="50" rx="4"/>
    <rect x="360" y="56" width="120" height="50" rx="4"/>
    <rect x="528" y="56" width="120" height="50" rx="4"/>
  </g>
  <g fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 3">
    <rect x="144" y="56" width="48" height="50" rx="4"/>
    <rect x="312" y="56" width="48" height="50" rx="4"/>
    <rect x="480" y="56" width="48" height="50" rx="4"/>
    <rect x="648" y="56" width="48" height="50" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">
    <text x="84" y="78">segment</text>
    <text x="252" y="78">segment</text>
    <text x="420" y="78">segment</text>
    <text x="588" y="78">segment</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#1e3a8a">
    <text x="84" y="95">program A</text>
    <text x="252" y="95">program B</text>
    <text x="420" y="95">program C</text>
    <text x="588" y="95">program D</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#64748b">
    <text x="168" y="85">hole</text>
    <text x="336" y="85">hole</text>
    <text x="504" y="85">hole</text>
    <text x="672" y="85">hole</text>
  </g>

  <rect x="24" y="128" width="110" height="42" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="79" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">new program E</text>
  <text x="79" y="162" text-anchor="middle" font-size="11" fill="#4c1d95">wants memory</text>
  <text x="150" y="146" font-size="12" font-weight="700" fill="#0f172a">E does not fit into any hole.</text>
  <text x="150" y="164" font-size="12" fill="#475569">But the four holes together are big enough. This is external fragmentation.</text>
</svg>
