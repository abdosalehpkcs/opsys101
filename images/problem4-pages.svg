<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="p4a-title p4a-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="p4a-title">The pages of a program: some are in main memory, some are on disk</title>
  <desc id="p4a-desc">A program has six pages. Pages 0 to 3 are in main memory, which is fast. Pages 4 and 5 are on disk, which is slow.</desc>
  <defs>
    <marker id="p4a-arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
    <marker id="p4a-arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="309" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <g id="p4a-program" transform="translate(0 14)">
    <rect x="24" y="40" width="190" height="210" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="119" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Program</text>
    <text x="119" y="85" text-anchor="middle" font-size="12" fill="#475569">6 pages</text>
    <g font-size="12" text-anchor="middle" fill="#14532d">
      <rect x="47" y="100" width="64" height="36" rx="5" fill="#dcfce7" stroke="#16a34a"/>
      <text x="79" y="123">page 0</text>
      <rect x="127" y="100" width="64" height="36" rx="5" fill="#dcfce7" stroke="#16a34a"/>
      <text x="159" y="123">page 1</text>
      <rect x="47" y="148" width="64" height="36" rx="5" fill="#dcfce7" stroke="#16a34a"/>
      <text x="79" y="171">page 2</text>
      <rect x="127" y="148" width="64" height="36" rx="5" fill="#dcfce7" stroke="#16a34a"/>
      <text x="159" y="171">page 3</text>
    </g>
    <g font-size="12" text-anchor="middle" fill="#7c2d12">
      <rect x="47" y="196" width="64" height="36" rx="5" fill="#ffedd5" stroke="#ea580c"/>
      <text x="79" y="219">page 4</text>
      <rect x="127" y="196" width="64" height="36" rx="5" fill="#ffedd5" stroke="#ea580c"/>
      <text x="159" y="219">page 5</text>
    </g>
  </g>

  <path d="M214 156 C 272 156, 282 92, 334 92" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#p4a-arrow-green)"/>
  <path d="M214 228 C 272 228, 282 222, 334 222" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#p4a-arrow-orange)"/>

  <g id="p4a-memory">
    <rect x="340" y="36" width="396" height="112" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="356" y="62" font-size="15" font-weight="700" fill="#14532d">Main memory (RAM)</text>
    <rect x="668" y="46" width="52" height="22" rx="11" fill="#16a34a"/>
    <text x="694" y="61" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">fast</text>
    <g font-size="12" text-anchor="middle" fill="#14532d">
      <rect x="356" y="74" width="64" height="36" rx="5" fill="#dcfce7" stroke="#16a34a"/>
      <text x="388" y="97">page 0</text>
      <rect x="428" y="74" width="64" height="36" rx="5" fill="#dcfce7" stroke="#16a34a"/>
      <text x="460" y="97">page 1</text>
      <rect x="500" y="74" width="64" height="36" rx="5" fill="#dcfce7" stroke="#16a34a"/>
      <text x="532" y="97">page 2</text>
      <rect x="572" y="74" width="64" height="36" rx="5" fill="#dcfce7" stroke="#16a34a"/>
      <text x="604" y="97">page 3</text>
    </g>
    <text x="356" y="133" font-size="12" fill="#475569">The CPU can use these pages right away.</text>
  </g>

  <g id="p4a-disk">
    <rect x="340" y="166" width="396" height="112" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="7 4"/>
    <text x="356" y="192" font-size="15" font-weight="700" fill="#7c2d12">Disk</text>
    <rect x="668" y="176" width="52" height="22" rx="11" fill="#ea580c"/>
    <text x="694" y="191" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">slow</text>
    <g font-size="12" text-anchor="middle" fill="#7c2d12">
      <rect x="356" y="204" width="64" height="36" rx="5" fill="#ffedd5" stroke="#ea580c"/>
      <text x="388" y="227">page 4</text>
      <rect x="428" y="204" width="64" height="36" rx="5" fill="#ffedd5" stroke="#ea580c"/>
      <text x="460" y="227">page 5</text>
    </g>
    <text x="356" y="263" font-size="12" fill="#475569">The OS must first read these pages into main memory.</text>
  </g>
</svg>
