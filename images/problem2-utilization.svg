<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" role="img" aria-labelledby="p2b-title p2b-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="p2b-title">CPU time before and after we add 1 MB</title>
  <desc id="p2b-desc">Two bars. With 2 MB and 3 programs the CPU is busy 78.4 percent of the time and idle 21.6 percent. With 3 MB and 5 programs the CPU is busy 92.2 percent and idle 7.8 percent. The growth of the busy part is 13.8 percent.</desc>

  <rect x="0.5" y="0.5" width="759" height="195" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#0f172a">CPU time before and after we add 1 MB</text>

  <g font-size="13" fill="#334155">
    <text x="24" y="78">2 MB, 3 programs</text>
    <text x="24" y="132">3 MB, 5 programs</text>
  </g>

  <g id="p2b-before">
    <rect x="170" y="56" width="344.96" height="34" rx="3" fill="#86efac" stroke="#16a34a"/>
    <rect x="514.96" y="56" width="95.04" height="34" rx="3" fill="#fdba74" stroke="#ea580c"/>
    <text x="342.5" y="78" text-anchor="middle" font-size="12" fill="#14532d">CPU busy 78.4%</text>
    <text x="624" y="78" font-size="13" font-weight="700" fill="#7c2d12">idle 21.6%</text>
  </g>

  <line x1="514.96" y1="90" x2="514.96" y2="110" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <g id="p2b-after">
    <rect x="170" y="110" width="344.96" height="34" rx="3" fill="#86efac" stroke="#16a34a"/>
    <rect x="514.96" y="110" width="60.83" height="34" rx="3" fill="#15803d" stroke="#14532d"/>
    <rect x="575.79" y="110" width="34.21" height="34" rx="3" fill="#fdba74" stroke="#ea580c"/>
    <text x="342.5" y="132" text-anchor="middle" font-size="12" fill="#14532d">as before: 78.4%</text>
    <text x="545.4" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">+13.8%</text>
    <text x="624" y="132" font-size="13" font-weight="700" fill="#7c2d12">idle 7.8%</text>
  </g>

  <text x="24" y="174" font-size="12" fill="#475569">The dark green part is the growth. After: CPU busy 78.4% + 13.8% = 92.2%.</text>
</svg>
