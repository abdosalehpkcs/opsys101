<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="p2c-title p2c-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="p2c-title">CPU utilization for 1 to 10 programs when each program waits 60 percent of the time</title>
  <desc id="p2c-desc">A bar chart. CPU utilization is 40 percent with 1 program, 64 with 2, 78.4 with 3, 87.0 with 4, 92.2 with 5, 95.3 with 6, 97.2 with 7, 98.3 with 8, 98.99 with 9 and 99.4 with 10. The goal is 99 percent. Nine programs are a little too low. Ten programs are enough.</desc>

  <rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#0f172a">CPU utilization for 1 to 10 programs (each program waits 60% of the time)</text>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="70" y1="210" x2="730" y2="210"/>
    <line x1="70" y1="160" x2="730" y2="160"/>
    <line x1="70" y1="110" x2="730" y2="110"/>
  </g>
  <g font-size="11" text-anchor="end" fill="#475569">
    <text x="62" y="264">0%</text>
    <text x="62" y="214">25%</text>
    <text x="62" y="164">50%</text>
    <text x="62" y="114">75%</text>
  </g>

  <g fill="#bbf7d0" stroke="#16a34a">
    <rect x="78" y="180" width="44" height="80"/>
    <rect x="144" y="132" width="44" height="128"/>
    <rect x="210" y="103.2" width="44" height="156.8"/>
    <rect x="276" y="85.92" width="44" height="174.08"/>
    <rect x="342" y="75.55" width="44" height="184.45"/>
    <rect x="408" y="69.33" width="44" height="190.67"/>
    <rect x="474" y="65.6" width="44" height="194.4"/>
    <rect x="540" y="63.36" width="44" height="196.64"/>
  </g>
  <rect x="606" y="62.02" width="44" height="197.98" fill="#fed7aa" stroke="#ea580c"/>
  <rect x="672" y="61.21" width="44" height="198.79" fill="#16a34a" stroke="#14532d"/>

  <g font-size="11" text-anchor="middle" fill="#14532d">
    <text x="100" y="196">40%</text>
    <text x="166" y="148">64%</text>
    <text x="232" y="119">78.4%</text>
    <text x="298" y="102">87.0%</text>
    <text x="364" y="92">92.2%</text>
    <text x="430" y="86">95.3%</text>
    <text x="496" y="82">97.2%</text>
    <text x="562" y="80">98.3%</text>
  </g>
  <text x="628" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#7c2d12">98.99%</text>
  <text x="694" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">99.4%</text>

  <line x1="70" y1="62" x2="730" y2="62" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="74" y="54" font-size="12" font-weight="700" fill="#dc2626">goal: 99%</text>

  <line x1="70" y1="260" x2="730" y2="260" stroke="#64748b" stroke-width="1.5"/>
  <g font-size="12" text-anchor="middle" fill="#334155">
    <text x="100" y="278">1</text>
    <text x="166" y="278">2</text>
    <text x="232" y="278">3</text>
    <text x="298" y="278">4</text>
    <text x="364" y="278">5</text>
    <text x="430" y="278">6</text>
    <text x="496" y="278">7</text>
    <text x="562" y="278">8</text>
    <text x="628" y="278" font-weight="700">9</text>
    <text x="694" y="278" font-weight="700">10</text>
  </g>
  <text x="628" y="295" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">too low</text>
  <text x="694" y="295" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">enough</text>
  <text x="400" y="316" text-anchor="middle" font-size="12" fill="#475569">number of programs in memory (n)</text>
</svg>
