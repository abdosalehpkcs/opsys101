<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="p8b-title p8b-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="p8b-title">Twice as many frames: the page faults come half as often</title>
  <desc id="p8b-desc">Two time lines of the same program. Before: the program runs some instructions, then has a page fault, four times. With twice as many frames: the program runs twice as many instructions between two page faults, so it has only two page faults. The time for the instructions is the same in both rows. The picture is not to scale.</desc>

  <rect x="0.5" y="0.5" width="759" height="299" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#0f172a">Twice as many frames: the page faults come half as often</text>

  <g id="p8b-before">
    <text x="24" y="60" font-size="13" font-weight="700" fill="#334155">Before</text>
    <g fill="#86efac" stroke="#16a34a">
      <rect x="24" y="68" width="100" height="36" rx="3"/>
      <rect x="184" y="68" width="100" height="36" rx="3"/>
      <rect x="344" y="68" width="100" height="36" rx="3"/>
      <rect x="504" y="68" width="100" height="36" rx="3"/>
    </g>
    <g fill="#fed7aa" stroke="#ea580c">
      <rect x="124" y="68" width="60" height="36" rx="3"/>
      <rect x="284" y="68" width="60" height="36" rx="3"/>
      <rect x="444" y="68" width="60" height="36" rx="3"/>
      <rect x="604" y="68" width="60" height="36" rx="3"/>
    </g>
    <g font-size="11" text-anchor="middle" fill="#14532d">
      <text x="74" y="90">instructions</text>
      <text x="234" y="90">instructions</text>
      <text x="394" y="90">instructions</text>
      <text x="554" y="90">instructions</text>
    </g>
    <g font-size="11" font-weight="700" text-anchor="middle" fill="#7c2d12">
      <text x="154" y="90">fault</text>
      <text x="314" y="90">fault</text>
      <text x="474" y="90">fault</text>
      <text x="634" y="90">fault</text>
    </g>
    <path d="M24 110 V117 H124 V110" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    <text x="24" y="134" font-size="12" fill="#14532d">the instructions between two page faults</text>
    <text x="676" y="91" font-size="12" font-weight="700" fill="#7c2d12">4 faults</text>
  </g>

  <g id="p8b-after">
    <text x="24" y="166" font-size="13" font-weight="700" fill="#334155">With twice as many frames</text>
    <g fill="#86efac" stroke="#16a34a">
      <rect x="24" y="174" width="200" height="36" rx="3"/>
      <rect x="284" y="174" width="200" height="36" rx="3"/>
    </g>
    <g fill="#fed7aa" stroke="#ea580c">
      <rect x="224" y="174" width="60" height="36" rx="3"/>
      <rect x="484" y="174" width="60" height="36" rx="3"/>
    </g>
    <g font-size="11" text-anchor="middle" fill="#14532d">
      <text x="124" y="196">instructions</text>
      <text x="384" y="196">instructions</text>
    </g>
    <g font-size="11" font-weight="700" text-anchor="middle" fill="#7c2d12">
      <text x="254" y="196">fault</text>
      <text x="514" y="196">fault</text>
    </g>
    <path d="M24 216 V223 H224 V216" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    <text x="24" y="240" font-size="12" fill="#14532d">twice as many instructions between two page faults</text>
    <text x="556" y="197" font-size="12" font-weight="700" fill="#7c2d12">2 faults</text>
  </g>

  <text x="24" y="264" font-size="12" fill="#475569">The green parts are the same in both rows: it is the same program. Only the number of page faults changes.</text>
  <text x="24" y="282" font-size="12" fill="#475569">Not to scale.</text>
</svg>
