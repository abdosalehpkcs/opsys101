<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="p5a-title p5a-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="p5a-title">One process with 8 pages and a physical memory with 32 page frames</title>
  <desc id="p5a-desc">On the left, one process with 8 pages, numbered 0 to 7. On the right, the physical memory with 32 page frames, numbered 0 to 31. The pages are mapped to frames. As an example, page 5 is stored in frame 18. A page and a frame have the same size: 1024 words.</desc>
  <defs>
    <marker id="p5a-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <g id="p5a-process">
    <rect x="24" y="36" width="210" height="254" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="129" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">One process</text>
    <text x="129" y="81" text-anchor="middle" font-size="12" fill="#475569">8 pages, numbered 0 to 7</text>
    <g fill="#dbeafe" stroke="#2563eb">
      <rect x="44" y="96" width="76" height="38" rx="5"/>
      <rect x="138" y="96" width="76" height="38" rx="5"/>
      <rect x="44" y="142" width="76" height="38" rx="5"/>
      <rect x="138" y="142" width="76" height="38" rx="5"/>
      <rect x="44" y="188" width="76" height="38" rx="5"/>
      <rect x="44" y="234" width="76" height="38" rx="5"/>
      <rect x="138" y="234" width="76" height="38" rx="5"/>
    </g>
    <rect x="138" y="188" width="76" height="38" rx="5" fill="#2563eb" stroke="#1e3a8a"/>
    <g font-size="12" text-anchor="middle" fill="#1e3a8a">
      <text x="82" y="120">page 0</text>
      <text x="176" y="120">page 1</text>
      <text x="82" y="166">page 2</text>
      <text x="176" y="166">page 3</text>
      <text x="82" y="212">page 4</text>
      <text x="82" y="258">page 6</text>
      <text x="176" y="258">page 7</text>
    </g>
    <text x="176" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">page 5</text>
  </g>

  <text x="282" y="153" text-anchor="middle" font-size="12" fill="#475569">mapped to</text>
  <line x1="242" y1="163" x2="322" y2="163" stroke="#64748b" stroke-width="2" marker-end="url(#p5a-arrow)"/>

  <g id="p5a-memory">
    <rect x="330" y="36" width="406" height="254" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="346" y="62" font-size="15" font-weight="700" fill="#4c1d95">Physical memory (RAM)</text>
    <text x="346" y="81" font-size="12" fill="#475569">32 page frames, numbered 0 to 31</text>
    <g fill="#ede9fe" stroke="#7c3aed">
      <rect x="344" y="96" width="42" height="38" rx="5"/>
      <rect x="392" y="96" width="42" height="38" rx="5"/>
      <rect x="440" y="96" width="42" height="38" rx="5"/>
      <rect x="488" y="96" width="42" height="38" rx="5"/>
      <rect x="536" y="96" width="42" height="38" rx="5"/>
      <rect x="584" y="96" width="42" height="38" rx="5"/>
      <rect x="632" y="96" width="42" height="38" rx="5"/>
      <rect x="680" y="96" width="42" height="38" rx="5"/>
      <rect x="344" y="142" width="42" height="38" rx="5"/>
