      <rect x="680" y="142" width="42" height="38" rx="5"/>
      <rect x="344" y="188" width="42" height="38" rx="5"/>
      <rect x="392" y="188" width="42" height="38" rx="5"/>
      <rect x="488" y="188" width="42" height="38" rx="5"/>
      <rect x="536" y="188" width="42" height="38" rx="5"/>
      <rect x="584" y="188" width="42" height="38" rx="5"/>
      <rect x="632" y="188" width="42" height="38" rx="5"/>
      <rect x="680" y="188" width="42" height="38" rx="5"/>
      <rect x="344" y="234" width="42" height="38" rx="5"/>
      <rect x="392" y="234" width="42" height="38" rx="5"/>
      <rect x="440" y="234" width="42" height="38" rx="5"/>
      <rect x="488" y="234" width="42" height="38" rx="5"/>
      <rect x="536" y="234" width="42" height="38" rx="5"/>
      <rect x="584" y="234" width="42" height="38" rx="5"/>
      <rect x="632" y="234" width="42" height="38" rx="5"/>
      <rect x="680" y="234" width="42" height="38" rx="5"/>
    </g>
    <rect x="440" y="188" width="42" height="38" rx="5" fill="#7c3aed" stroke="#4c1d95"/>
    <g font-size="12" text-anchor="middle" fill="#4c1d95">
      <text x="365" y="120">0</text>
      <text x="413" y="120">1</text>
      <text x="461" y="120">2</text>
      <text x="509" y="120">3</text>
      <text x="557" y="120">4</text>
      <text x="605" y="120">5</text>
      <text x="653" y="120">6</text>
      <text x="701" y="120">7</text>
      <text x="365" y="166">8</text>
      <text x="413" y="166">9</text>
      <text x="461" y="166">10</text>
      <text x="509" y="166">11</text>
      <text x="557" y="166">12</text>
      <text x="605" y="166">13</text>
      <text x="653" y="166">14</text>
      <text x="701" y="166">15</text>
      <text x="365" y="212">16</text>
      <text x="413" y="212">17</text>
      <text x="509" y="212">19</text>
      <text x="557" y="212">20</text>
      <text x="605" y="212">21</text>
      <text x="653" y="212">22</text>
      <text x="701" y="212">23</text>
      <text x="365" y="258">24</text>
