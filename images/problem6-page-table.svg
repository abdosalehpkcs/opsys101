<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" role="img" aria-labelledby="p6a-title p6a-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="p6a-title">The page table has one entry for every page</title>
  <desc id="p6a-desc">On the left, the address space of a process, cut into pages: page 0, page 1, page 2 and so on to the last page. On the right, the page table of the process. It has one entry for each page, and each entry holds the frame number of that page.</desc>
  <defs>
    <marker id="p6a-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="317" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#0f172a">The page table has one entry for every page</text>

  <g id="p6a-space">
    <rect x="24" y="46" width="230" height="226" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="139" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Address space of a process</text>
    <g fill="#dbeafe" stroke="#2563eb">
      <rect x="54" y="86" width="170" height="32" rx="5"/>
      <rect x="54" y="124" width="170" height="32" rx="5"/>
      <rect x="54" y="162" width="170" height="32" rx="5"/>
      <rect x="54" y="232" width="170" height="32" rx="5"/>
    </g>
    <g font-size="12" text-anchor="middle" fill="#1e3a8a">
      <text x="139" y="107">page 0</text>
      <text x="139" y="145">page 1</text>
      <text x="139" y="183">page 2</text>
      <text x="139" y="253">last page</text>
    </g>
    <g fill="#2563eb">
      <circle cx="139" cy="205" r="2.5"/>
      <circle cx="139" cy="213" r="2.5"/>
      <circle cx="139" cy="221" r="2.5"/>
    </g>
  </g>

  <g id="p6a-table">
    <rect x="440" y="46" width="296" height="226" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="588" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Page table of the process</text>
    <g fill="#dbeafe" stroke="#2563eb">
      <rect x="456" y="86" width="150" height="32"/>
      <rect x="456" y="124" width="150" height="32"/>
      <rect x="456" y="162" width="150" height="32"/>
      <rect x="456" y="232" width="150" height="32"/>
    </g>
    <g fill="#ede9fe" stroke="#7c3aed">
      <rect x="606" y="86" width="114" height="32"/>
      <rect x="606" y="124" width="114" height="32"/>
      <rect x="606" y="162" width="114" height="32"/>
      <rect x="606" y="232" width="114" height="32"/>
    </g>
    <g font-size="12" text-anchor="middle" fill="#1e3a8a">
      <text x="531" y="107">entry for page 0</text>
      <text x="531" y="145">entry for page 1</text>
      <text x="531" y="183">entry for page 2</text>
      <text x="531" y="253">entry for last page</text>
    </g>
    <g font-size="12" text-anchor="middle" fill="#4c1d95">
      <text x="663" y="107">frame number</text>
      <text x="663" y="145">frame number</text>
      <text x="663" y="183">frame number</text>
      <text x="663" y="253">frame number</text>
    </g>
    <g fill="#64748b">
      <circle cx="588" cy="205" r="2.5"/>
      <circle cx="588" cy="213" r="2.5"/>
      <circle cx="588" cy="221" r="2.5"/>
    </g>
  </g>

  <g stroke="#64748b" stroke-width="2">
    <line x1="224" y1="102" x2="454" y2="102" marker-end="url(#p6a-arrow)"/>
    <line x1="224" y1="140" x2="454" y2="140" marker-end="url(#p6a-arrow)"/>
    <line x1="224" y1="178" x2="454" y2="178" marker-end="url(#p6a-arrow)"/>
    <line x1="224" y1="248" x2="454" y2="248" marker-end="url(#p6a-arrow)"/>
  </g>
  <text x="347" y="95" text-anchor="middle" font-size="11" fill="#475569">has one entry</text>

  <text x="24" y="298" font-size="12" fill="#475569">One page, one entry. An address space with many pages has a long page table.</text>
</svg>
