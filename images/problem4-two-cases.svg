<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" role="img" aria-labelledby="p4b-title p4b-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="p4b-title">Two kinds of instructions: a normal instruction and an instruction with a page fault</title>
  <desc id="p4b-desc">A normal instruction needs a page that is in main memory. It takes 1 microsecond. An instruction with a page fault needs a page that is not in main memory. The OS reads the page from disk, so the instruction takes 1 plus n microseconds.</desc>
  <defs>
    <marker id="p4b-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="231" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <g id="p4b-normal">
    <text x="24" y="34" font-size="15" font-weight="700" fill="#166534">Normal instruction</text>

    <rect x="24" y="46" width="160" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="104" y="68" text-anchor="middle" font-size="13" fill="#1e3a8a">The instruction</text>
    <text x="104" y="85" text-anchor="middle" font-size="13" fill="#1e3a8a">needs a page</text>

    <line x1="184" y1="72" x2="210" y2="72" stroke="#64748b" stroke-width="2" marker-end="url(#p4b-arrow)"/>

    <rect x="212" y="46" width="190" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="307" y="68" text-anchor="middle" font-size="13" fill="#14532d">The page is</text>
    <text x="307" y="85" text-anchor="middle" font-size="13" fill="#14532d">in main memory</text>

    <line x1="402" y1="72" x2="636" y2="72" stroke="#64748b" stroke-width="2" marker-end="url(#p4b-arrow)"/>
    <text x="519" y="63" text-anchor="middle" font-size="12" fill="#475569">no waiting</text>

    <rect x="638" y="46" width="98" height="52" rx="8" fill="#16a34a"/>
    <text x="687" y="78" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1 µs</text>
  </g>

  <g id="p4b-fault">
    <text x="24" y="142" font-size="15" font-weight="700" fill="#9a3412">Instruction with a page fault</text>

    <rect x="24" y="154" width="160" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="104" y="176" text-anchor="middle" font-size="13" fill="#1e3a8a">The instruction</text>
    <text x="104" y="193" text-anchor="middle" font-size="13" fill="#1e3a8a">needs a page</text>

    <line x1="184" y1="180" x2="210" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#p4b-arrow)"/>

    <rect x="212" y="154" width="190" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="307" y="176" text-anchor="middle" font-size="13" fill="#7c2d12">The page is not in</text>
    <text x="307" y="193" text-anchor="middle" font-size="13" fill="#7c2d12">main memory: page fault</text>

    <line x1="402" y1="180" x2="428" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#p4b-arrow)"/>

    <rect x="430" y="154" width="180" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="520" y="176" text-anchor="middle" font-size="13" fill="#7c2d12">The OS reads the page</text>
    <text x="520" y="193" text-anchor="middle" font-size="13" fill="#7c2d12">from disk (slow)</text>

    <line x1="610" y1="180" x2="636" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#p4b-arrow)"/>

    <rect x="638" y="154" width="98" height="52" rx="8" fill="#ea580c"/>
    <text x="687" y="186" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1 + n µs</text>
  </g>
</svg>
