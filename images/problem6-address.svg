<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 178" role="img" aria-labelledby="p6c-title p6c-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="p6c-title">A 32-bit address is a page number and an offset</title>
  <desc id="p6c-desc">An address drawn as 32 boxes, one box for each bit. The first 19 bits are the page number. The last 13 bits are the offset, because a page has 8 kB, which is 8192 bytes or 2 to the power of 13 bytes.</desc>

  <rect x="0.5" y="0.5" width="759" height="177" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#0f172a">A 32-bit address is a page number and an offset</text>

  <path d="M28 72 V65 H730 V72" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="379" y="59" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">32 bits</text>

  <g fill="#dbeafe" stroke="#2563eb">
    <rect x="28" y="78" width="20" height="30" rx="3"/>
    <rect x="50" y="78" width="20" height="30" rx="3"/>
    <rect x="72" y="78" width="20" height="30" rx="3"/>
    <rect x="94" y="78" width="20" height="30" rx="3"/>
    <rect x="116" y="78" width="20" height="30" rx="3"/>
    <rect x="138" y="78" width="20" height="30" rx="3"/>
    <rect x="160" y="78" width="20" height="30" rx="3"/>
    <rect x="182" y="78" width="20" height="30" rx="3"/>
    <rect x="204" y="78" width="20" height="30" rx="3"/>
    <rect x="226" y="78" width="20" height="30" rx="3"/>
    <rect x="248" y="78" width="20" height="30" rx="3"/>
    <rect x="270" y="78" width="20" height="30" rx="3"/>
    <rect x="292" y="78" width="20" height="30" rx="3"/>
    <rect x="314" y="78" width="20" height="30" rx="3"/>
    <rect x="336" y="78" width="20" height="30" rx="3"/>
    <rect x="358" y="78" width="20" height="30" rx="3"/>
    <rect x="380" y="78" width="20" height="30" rx="3"/>
    <rect x="402" y="78" width="20" height="30" rx="3"/>
    <rect x="424" y="78" width="20" height="30" rx="3"/>
  </g>
  <g fill="#fef3c7" stroke="#d97706">
    <rect x="446" y="78" width="20" height="30" rx="3"/>
    <rect x="468" y="78" width="20" height="30" rx="3"/>
    <rect x="490" y="78" width="20" height="30" rx="3"/>
    <rect x="512" y="78" width="20" height="30" rx="3"/>
    <rect x="534" y="78" width="20" height="30" rx="3"/>
    <rect x="556" y="78" width="20" height="30" rx="3"/>
    <rect x="578" y="78" width="20" height="30" rx="3"/>
    <rect x="600" y="78" width="20" height="30" rx="3"/>
    <rect x="622" y="78" width="20" height="30" rx="3"/>
    <rect x="644" y="78" width="20" height="30" rx="3"/>
    <rect x="666" y="78" width="20" height="30" rx="3"/>
    <rect x="688" y="78" width="20" height="30" rx="3"/>
    <rect x="710" y="78" width="20" height="30" rx="3"/>
  </g>

  <path d="M28 114 V121 H444 V114" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M446 114 V121 H730 V114" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <text x="236" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">page number: 19 bits</text>
  <text x="236" y="158" text-anchor="middle" font-size="12" fill="#475569">32 − 13 = 19</text>
  <text x="588" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">offset: 13 bits</text>
  <text x="588" y="158" text-anchor="middle" font-size="12" fill="#475569">8 kB = 8192 bytes = 2¹³ bytes</text>
</svg>
