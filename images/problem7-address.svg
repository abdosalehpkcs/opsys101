<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" role="img" aria-labelledby="p7b-title p7b-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="p7b-title">The address has three parts, one for each step</title>
  <desc id="p7b-desc">A 32-bit address with three parts: 9 bits, 11 bits and the offset. The 9 bits choose one entry of the page directory. This entry says where one page table is. The 11 bits choose one entry of that page table. This entry says in which frame the page is. The offset chooses one byte inside the page.</desc>
  <defs>
    <marker id="p7b-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="305" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#0f172a">The address has three parts, one for each step</text>

  <path d="M24 66 V59 H736 V66" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="380" y="53" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">one address: 32 bits</text>

  <g id="p7b-address">
    <rect x="24" y="72" width="200" height="40" rx="5" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <rect x="224" y="72" width="244" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="468" y="72" width="268" height="40" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="124" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">9 bits</text>
    <text x="346" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">11 bits</text>
    <text x="602" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">offset</text>
  </g>

  <g stroke="#64748b" stroke-width="2">
    <line x1="119" y1="112" x2="119" y2="146" marker-end="url(#p7b-arrow)"/>
    <line x1="346" y1="112" x2="346" y2="146" marker-end="url(#p7b-arrow)"/>
    <line x1="607" y1="112" x2="607" y2="146" marker-end="url(#p7b-arrow)"/>
    <line x1="214" y1="177" x2="242" y2="177" marker-end="url(#p7b-arrow)"/>
    <line x1="446" y1="177" x2="474" y2="177" marker-end="url(#p7b-arrow)"/>
  </g>

  <g id="p7b-steps">
    <rect x="24" y="150" width="190" height="54" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <text x="119" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">1. Page directory</text>
    <text x="119" y="190" text-anchor="middle" font-size="11" fill="#134e4a">the 9 bits choose one entry</text>

    <rect x="246" y="150" width="200" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="346" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">2. Page table</text>
    <text x="346" y="190" text-anchor="middle" font-size="11" fill="#1e3a8a">the 11 bits choose one entry</text>

    <rect x="478" y="150" width="258" height="54" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="607" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">3. Page (stored in a frame)</text>
    <text x="607" y="190" text-anchor="middle" font-size="11" fill="#78350f">the offset chooses one byte</text>
  </g>

  <g font-size="12" fill="#475569">
    <text x="24" y="234">1. The 9 bits choose one entry of the page directory. The entry says where one page table is.</text>
    <text x="24" y="254">2. The 11 bits choose one entry of that page table. The entry says in which frame the page is.</text>
    <text x="24" y="274">3. The offset chooses one byte inside the page.</text>
  </g>
</svg>
