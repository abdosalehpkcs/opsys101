<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" role="img" aria-labelledby="p3b-title p3b-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="p3b-title">Compaction moves all segments together</title>
  <desc id="p3b-desc">Before compaction, the memory has four segments A, B, C and D with a small hole after each. After compaction, the four segments are next to each other on the left, and all the free memory is one big hole on the right. The new program E fits now.</desc>
  <defs>
    <marker id="p3b-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="231" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#0f172a">Compaction moves all segments together</text>

  <g id="p3b-before">
    <text x="24" y="84" font-size="13" font-weight="700" fill="#334155">Before</text>
    <g fill="#dbeafe" stroke="#2563eb">
      <rect x="96" y="58" width="110" height="42" rx="4"/>
      <rect x="250" y="58" width="110" height="42" rx="4"/>
      <rect x="404" y="58" width="110" height="42" rx="4"/>
      <rect x="558" y="58" width="110" height="42" rx="4"/>
    </g>
    <g fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 3">
      <rect x="206" y="58" width="44" height="42" rx="4"/>
      <rect x="360" y="58" width="44" height="42" rx="4"/>
      <rect x="514" y="58" width="44" height="42" rx="4"/>
      <rect x="668" y="58" width="44" height="42" rx="4"/>
    </g>
    <g text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">
      <text x="151" y="84">A</text>
      <text x="305" y="84">B</text>
      <text x="459" y="84">C</text>
      <text x="613" y="84">D</text>
    </g>
    <g text-anchor="middle" font-size="11" fill="#64748b">
      <text x="228" y="83">hole</text>
      <text x="382" y="83">hole</text>
      <text x="536" y="83">hole</text>
      <text x="690" y="83">hole</text>
    </g>
  </g>

  <line x1="60" y1="106" x2="60" y2="144" stroke="#64748b" stroke-width="2" marker-end="url(#p3b-arrow)"/>
  <text x="96" y="130" font-size="12" fill="#475569">compaction: the CPU copies the segments to one side</text>

  <g id="p3b-after">
    <text x="24" y="176" font-size="13" font-weight="700" fill="#334155">After</text>
    <g fill="#dbeafe" stroke="#2563eb">
      <rect x="96" y="150" width="110" height="42" rx="4"/>
      <rect x="206" y="150" width="110" height="42" rx="4"/>
      <rect x="316" y="150" width="110" height="42" rx="4"/>
      <rect x="426" y="150" width="110" height="42" rx="4"/>
    </g>
    <rect x="536" y="150" width="176" height="42" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 3"/>
    <g text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">
      <text x="151" y="176">A</text>
      <text x="261" y="176">B</text>
      <text x="371" y="176">C</text>
      <text x="481" y="176">D</text>
    </g>
    <text x="624" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">one big hole</text>
    <text x="624" y="184" text-anchor="middle" font-size="11" fill="#64748b">program E fits now</text>
    <text x="96" y="214" font-size="12" fill="#475569">Now all the free memory is in one piece.</text>
  </g>
</svg>
