<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 176" role="img" aria-labelledby="p6d-title p6d-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="p6d-title">The 100 ms of one process, to scale</title>
  <desc id="p6d-desc">A time line from 0 to 100 milliseconds. For the first 52.43 milliseconds the CPU loads the page table. For the other 47.57 milliseconds the process runs. Loading takes about 52 percent of the CPU time.</desc>

  <rect x="0.5" y="0.5" width="759" height="175" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#0f172a">The 100 ms of one process, to scale</text>

  <rect x="24" y="52" width="372.25" height="48" rx="3" fill="#fed7aa" stroke="#ea580c"/>
  <rect x="396.25" y="52" width="337.75" height="48" rx="3" fill="#86efac" stroke="#16a34a"/>
  <text x="210" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">the CPU loads the page table</text>
  <text x="210" y="90" text-anchor="middle" font-size="12" fill="#7c2d12">52.43 ms</text>
  <text x="565" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">the process runs</text>
  <text x="565" y="90" text-anchor="middle" font-size="12" fill="#14532d">47.57 ms</text>

  <line x1="24" y1="114" x2="734" y2="114" stroke="#64748b" stroke-width="1.5"/>
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="24" y1="110" x2="24" y2="118"/>
    <line x1="201.5" y1="110" x2="201.5" y2="118"/>
    <line x1="379" y1="110" x2="379" y2="118"/>
    <line x1="556.5" y1="110" x2="556.5" y2="118"/>
    <line x1="734" y1="110" x2="734" y2="118"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#475569">
    <text x="24" y="133" text-anchor="start">0 ms</text>
    <text x="201.5" y="133">25 ms</text>
    <text x="379" y="133">50 ms</text>
    <text x="556.5" y="133">75 ms</text>
    <text x="734" y="133" text-anchor="end">100 ms</text>
  </g>

  <text x="24" y="158" font-size="12" fill="#475569">Loading takes 52.43 ms of every 100 ms: about 52% of the CPU time.</text>
</svg>
